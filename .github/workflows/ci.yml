name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matrixpos
          POSTGRES_PASSWORD: matrixpos
          POSTGRES_DB: matrixpos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matrixpos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://matrixpos:matrixpos@localhost:5432/matrixpos
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:seed
      - run: npm run build
